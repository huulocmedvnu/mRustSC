[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "metalcyte"
version = "0.3.0"
description = "Single-cell analysis engine for Apple silicon: a Rust core, Metal kernels and an out-of-core head for million-cell atlases"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "huulocmedvnu" }]
keywords = ["single-cell", "anndata", "rust", "metal", "apple-silicon", "gpu"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
# Imported at run time by the Python layer: numpy and scipy.sparse at module
# level, pandas inside the functions that return frames. anndata is a
# TYPE_CHECKING import only, but every public function takes an AnnData, so the
# package is unusable without it.
dependencies = ["numpy>=2.0", "anndata>=0.10", "scipy>=1.13", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# The scanpy cross-checks; scanpy pulls in leidenalg's reference implementation.
reference = ["scanpy>=1.10", "leidenalg>=0.10"]
# Native plotting (`metalcyte.pl`); seaborn only for its categorical palettes.
plot = ["matplotlib>=3.7", "seaborn>=0.13"]

[project.urls]
Homepage = "https://github.com/huulocmedvnu/metalcyte"
Repository = "https://github.com/huulocmedvnu/metalcyte"
Issues = "https://github.com/huulocmedvnu/metalcyte/issues"

[tool.maturin]
module-name = "metalcyte._metalcyte"
python-source = "python"
manifest-path = "crates/metalcyte-py/Cargo.toml"
# Apple Accelerate (vecLib BLAS/LAPACK) is on by default: metalcyte targets Apple silicon and
# CI runs on macOS. For a pure-Rust wheel (e.g. a Linux build), remove "accelerate" here.
features = ["pyo3/extension-module", "accelerate"]
# The typing marker is data, not a module, so it needs naming explicitly.
include = [{ path = "python/metalcyte/py.typed", format = "wheel" }]

[tool.ruff]
line-length = 100
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_classes = []
markers = [
    "reference: cross-checks results against scanpy; downloads datasets",
    "slow: drives umap-learn or scikit-learn over a full run; minutes, not seconds",
]
