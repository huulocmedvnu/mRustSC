[package]
name = "metalcyte-py"
version.workspace = true
edition.workspace = true

[lib]
name = "_metalcyte"
crate-type = ["cdylib"]

[dependencies]
metalcyte-core.workspace = true
# SPIKE (feature/multiagent-gpu-spike): metalcyte-gpu is wired in behind a device check so
# a Metal caller reaches the hand-written `knn_metal` kernel instead of the candle path.
# The dispatch lives in `embedding.rs`; the CPU path is unchanged. See the branch report
# for the overhead measurement that decides whether this stays.
metalcyte-gpu.workspace = true
candle-core.workspace = true
ndarray.workspace = true
numpy = "0.23"
pyo3 = { version = "0.23", features = ["extension-module"] }

[features]
# `maturin develop --features accelerate` builds the extension with Apple Accelerate BLAS
# behind the dense linear algebra; the default wheel stays pure-Rust and portable.
accelerate = ["metalcyte-core/accelerate", "metalcyte-gpu/accelerate"]
